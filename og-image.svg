<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <radialGradient id="glowG" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG2" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgG)"/>
  <rect width="1200" height="630" fill="url(#glowG)"/>
  <rect width="1200" height="630" fill="url(#glowG2)"/>

  <!-- Top thin bar (brand accent) -->
  <rect x="0" y="0" width="1200" height="6" fill="#059669"/>
  <rect x="0" y="0" width="600" height="6" fill="#d97706"/>

  <!-- Logo (signature wordmark) -->
  <g transform="translate(80 100)">
    <text x="0" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" fill="#d97706">BAM</text>
    <text x="340" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-style="italic" fill="#059669">Studios</text>
    <circle cx="820" cy="100" r="14" fill="#d97706"/>
  </g>

  <!-- Tagline -->
  <text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#111827" letter-spacing="-2">
    Craft.
    <tspan fill="#059669">Ship.</tspan>
    <tspan fill="#d97706">Serve.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6b7280">
    Secure, Halal SaaS products for the Muslim Ummah.
  </text>

  <!-- Products strip -->
  <g transform="translate(80 470)">
    <rect x="0" y="0" width="260" height="70" rx="14" fill="#059669"/>
    <text x="130" y="44" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">APKForge · Live</text>

    <rect x="280" y="0" width="300" height="70" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="430" y="44" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle">BAM Coder · Soon</text>
  </g>

  <!-- URL bottom -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="20" fill="#9ca3af">
    bam-studios-website.pages.dev
  </text>

  <!-- Small dot accent bottom right -->
  <circle cx="1140" cy="580" r="20" fill="#059669" opacity="0.9"/>
  <circle cx="1100" cy="580" r="10" fill="#d97706" opacity="0.9"/>
</svg>
